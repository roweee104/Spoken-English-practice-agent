<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>成人英语口语 Agent · 可交互原型</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    background: #f2f4f8;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 顶部切换栏 */
  .appbar {
    flex: none;
    height: 58px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 18px;
    background: rgba(255,255,255,.92);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid #e7e9ef;
    z-index: 10;
  }
  .brand {
    display: flex; align-items: center; gap: 9px;
    font-size: 14px; font-weight: 700; color: #22283a;
    white-space: nowrap;
  }
  .brand .dot {
    width: 26px; height: 26px; border-radius: 8px;
    background: linear-gradient(135deg, #ffb07c, #e2603c);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .brand .sub {
    font-size: 11px; font-weight: 500; color: #8b93a7;
    margin-left: 2px;
  }

  .tabs {
    display: flex; gap: 4px; padding: 3px;
    background: #eef0f5; border-radius: 999px;
  }
  .tabs button {
    border: none; background: transparent; cursor: pointer;
    padding: 7px 18px; border-radius: 999px;
    font-size: 13px; font-weight: 600; color: #5d6577;
    font-family: inherit;
    transition: background .18s, color .18s;
    white-space: nowrap;
  }
  .tabs button.active {
    background: #fff; color: #1c2333;
    box-shadow: 0 1px 4px rgba(28,35,51,.12);
  }

  .spacer { flex: 1; }

  .hint {
    font-size: 11.5px; color: #8b93a7; white-space: nowrap;
  }
  .hint b { color: #5d6577; font-weight: 600; }

  .stage {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: none; background: transparent;
  }

  /* 移动端视图：给手机外框留出呼吸空间 */
  body[data-view="mobile"] .stage {
    background:
      radial-gradient(900px 520px at 12% 8%, #fff0e4 0%, transparent 62%),
      radial-gradient(760px 480px at 88% 92%, #ffe8f0 0%, transparent 58%),
      radial-gradient(700px 500px at 78% 12%, #e9f7f0 0%, transparent 60%),
      #fdf9f6;
  }
  body[data-view="web"] .stage {
    background: #f2f4f8;
  }

  @media (max-width: 720px) {
    .brand .sub, .hint { display: none; }
    .appbar { padding: 0 12px; gap: 10px; }
    .tabs button { padding: 7px 14px; font-size: 12.5px; }
  }
</style>
</head>

  var frame = document.getElementById("frame");
  var current = "mobile";

  function decode(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }

  function show(view) {
    if (view !== "mobile" && view !== "web") view = "mobile";
    current = view;
    document.body.setAttribute("data-view", view);
    document.querySelectorAll(".tabs button").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-view") === view);
    });
    frame.srcdoc = decode(DOCS[view]);
  }

  document.querySelectorAll(".tabs button").forEach(function (b) {
    b.addEventListener("click", function () {
      var v = b.getAttribute("data-view");
      show(v);
      try { history.replaceState(null, "", "#" + v); } catch (e) { location.hash = v; }
    });
  });

  // 来自 Web 端「去学习」按钮的切页请求
  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "switch-mobile") {
      show("mobile");
      try { history.replaceState(null, "", "#mobile"); } catch (err) {}
    }
  });

  // 支持 #web / #mobile 深链
  function initialView() {
    var h = (location.hash || "").replace("#", "").toLowerCase();
    return h === "web" ? "web" : "mobile";
  }
  show(initialView());
  window.addEventListener("hashchange", function () { show(initialView()); });
</script>
